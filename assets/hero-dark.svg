<svg xmlns="http://www.w3.org/2000/svg" width="830" height="280" viewBox="0 0 830 280" fill="none" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <radialGradient id="hg" cx="0.9" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#6366F1" stop-opacity=".28"/>
    <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ht" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <clipPath id="hk"><rect width="830" height="280" rx="26"/></clipPath>
</defs>
<style>
  .pulse{animation:p 2.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
  .drift{animation:d 9s ease-in-out infinite alternate}
  @keyframes d{from{transform:translateX(0)}to{transform:translateX(-24px)}}
</style>
<rect width="830" height="280" rx="26" fill="#14141C"/>
<g clip-path="url(#hk)"><rect class="drift" x="-30" width="890" height="280" fill="url(#hg)"/></g>
<rect x=".5" y=".5" width="829" height="279" rx="25.5" stroke="#FFFFFF" stroke-opacity=".08"/>

<g class="pulse"><circle cx="52" cy="58" r="5" fill="#22C55E"/></g>
<text x="68" y="63" font-size="14" font-weight="500" fill="#9A9AA8">Open to freelance &amp; full-time</text>
<text x="48" y="160" font-size="68" font-weight="700" letter-spacing="-2" fill="#F5F5F7">Gourav Raut</text>
<text x="50" y="205" font-size="24" font-weight="500" fill="url(#ht)">Full-stack engineer.</text>
<text x="50" y="238" font-size="20" fill="#9A9AA8">I build and ship production apps — mobile, backend, AI.</text>

</svg>
