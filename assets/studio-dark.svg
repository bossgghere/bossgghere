<svg xmlns="http://www.w3.org/2000/svg" width="830" height="140" viewBox="0 0 830 140" fill="none" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <radialGradient id="og" cx="0.95" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#6366F1" stop-opacity=".28"/>
    <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <clipPath id="ok"><rect width="830" height="140" rx="26"/></clipPath>
