  .drift{animation:d 9s ease-in-out infinite alternate}
  @keyframes d{from{transform:translateX(0)}to{transform:translateX(-24px)}}
</style>
<rect width="830" height="140" rx="26" fill="#14141C"/>
<g clip-path="url(#ok)"><rect class="drift" x="-30" width="890" height="140" fill="url(#og)"/></g>
<rect x=".5" y=".5" width="829" height="139" rx="25.5" stroke="#FFFFFF" stroke-opacity=".08"/>

<text x="32" y="46" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5E5E6E">STUDIO</text>
<text x="32" y="88" font-size="30" font-weight="700" letter-spacing="-.8" fill="#F5F5F7">One Day Studio</text>
<text x="32" y="116" font-size="16" fill="#9A9AA8">We ship full production apps — fast.</text>
