<svg xmlns="http://www.w3.org/2000/svg" width="270" height="150" viewBox="0 0 270 150" fill="none" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <radialGradient id="m1g" cx="0.9" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#5558E6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#5558E6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="m1t" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5558E6"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <clipPath id="m1k"><rect width="270" height="150" rx="26"/></clipPath>
</defs>
<style>
  .pulse{animation:p 2.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
  .drift{animation:d 9s ease-in-out infinite alternate}
  @keyframes d{from{transform:translateX(0)}to{transform:translateX(-24px)}}
</style>
<rect width="270" height="150" rx="26" fill="#F5F5F7"/>
<g clip-path="url(#m1k)"><rect class="drift" x="-30" width="330" height="150" fill="url(#m1g)"/></g>
<rect x=".5" y=".5" width="269" height="149" rx="25.5" stroke="#000000" stroke-opacity=".08"/>

<text x="32" y="86" font-size="58" font-weight="700" letter-spacing="-2" fill="url(#m1t)">10K+</text>
<text x="34" y="122" font-size="16" fill="#6E6E73">downloads on SnapLay</text>

</svg>
