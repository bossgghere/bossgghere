<svg xmlns="http://www.w3.org/2000/svg" width="270" height="150" viewBox="0 0 270 150" fill="none" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <radialGradient id="m3g" cx="0.9" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#6366F1" stop-opacity=".28"/>
    <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="m3t" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <clipPath id="m3k"><rect width="270" height="150" rx="26"/></clipPath>
</defs>
<style>
  .pulse{animation:p 2.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
  .drift{animation:d 9s ease-in-out infinite alternate}
  @keyframes d{from{transform:translateX(0)}to{transform:translateX(-24px)}}
</style>
<rect width="270" height="150" rx="26" fill="#14141C"/>
<g clip-path="url(#m3k)"><rect class="drift" x="-30" width="330" height="150" fill="url(#m3g)"/></g>
<rect x=".5" y=".5" width="269" height="149" rx="25.5" stroke="#FFFFFF" stroke-opacity=".08"/>

<text x="32" y="86" font-size="58" font-weight="700" letter-spacing="-2" fill="url(#m3t)">0→1</text>
<text x="34" y="122" font-size="16" fill="#9A9AA8">idea to Play Store</text>

</svg>
