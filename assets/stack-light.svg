<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200" fill="none" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
